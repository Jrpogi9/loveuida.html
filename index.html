<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hmm ano to? 💖</title>
    <style>
        body {
            text-align: center;
            font-family: 'Arial', sans-serif;
            background-color: #ffb6c1;
            overflow: hidden;
        }
        
        h1 {
            font-size: 2.5rem;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-top: 50px;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        
        button {
            font-size: 18px;
            padding: 12px 25px;
            margin: 10px;
            border: none;
            cursor: pointer;
            border-radius: 10px;
            transition: 0.3s ease-in-out;
        }
        
        .yes {
            background-color: red;
            color: white;
            font-weight: bold;
        }
        
        .no {
            background-color: white;
            color: black;
            position: absolute;
        }
        
        .heart {
            position: absolute;
            color: red;
            font-size: 20px;
            animation: float 5s linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100vh); opacity: 0; }
        }

        .valentine-message {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }

        .valentine-message img {
            width: 250px;
            margin-top: 10px;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
        }

    </style>
</head>
<body>

    <h1>Will you be my Valentine? 💖</h1>

    <div class="container">
        <button class="yes" onclick="loveAccepted()">Yes</button>
        <button class="no" id="noButton" onmouseover="moveButton()">No</button>
    </div>

    <div class="valentine-message" id="valentineMessage">
        <h2>I love you so much my IDA! 💖</h2>
               <img src="https://i.imgur.com/qbQXo9g.jpeg" alt="Cute Valentine">
               <h1>Wag ka na mag tampo my love!</h1>

    </div>

    <script>
        function loveAccepted() {
            document.getElementById("valentineMessage").style.display = "flex";
        }

        function moveButton() {
            let button = document.getElementById("noButton");
            let x = Math.random() * (window.innerWidth - 100);
            let y = Math.random() * (window.innerHeight - 50);
            button.style.left = `${x}px`;
            button.style.top = `${y}px`;
        }

        function createHearts() {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.innerHTML = "❤️";
            document.body.appendChild(heart);

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = Math.random() * 3 + 2 + "s";

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        setInterval(createHearts, 300);
    </script>

</body>
</html>
